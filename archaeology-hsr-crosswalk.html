" Type of past activity area(s) identified at the site. An existing controlled vocabulary should be used where possible, such as the Getty Research Institute Art & Architecture Thesaurus or the tDAR Data Dictionary.", "group": 1, "status": "Partial", "target": "subjects[].subject", "assessment": "Generic subject does not preserve site-type role.", "datacite": "DataCite:Subject\nSite type term. [§4.1, p.9]"}, {"number": "1.6.1", "field": "siteClassification", "obligation": "Mandatory", "description": " Mandatory if siteType is used. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for siteType b. The URI of the standard vocabulary being used c. The URI of the exact term used in siteType d. The classification code (if one exists) of the exact term used in siteType Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 1, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Generic vocabulary mechanics without site-type semantics.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nDistribute classification information across the relevant subject subproperties. [§4.1, p.9]"}, {"number": "1.7", "field": "Keywords", "obligation": "Optional", "description": " User created values to describe aspects of the site not covered by other metadata.", "group": 1, "status": "Partial", "target": "subjects[].subject", "assessment": "Generic keyword without explicit site scope.", "datacite": "Not explicitly mapped\nNo separate mapping for Project.Keywords is specified in the supplied recommendation. [§4.1, pp.8–9]"}, {"number": "2", "field": "investigationType", "obligation": "Recommended", "description": " Lists all investigation types relevant to the resource. Should follow a standard vocabulary such as that provided by the Intrusive Event concept provided in the FISH Event Types Thesaurus.", "group": 2, "status": "Partial", "target": "subjects[].subject; otherDescriptions[].description", "assessment": "No dedicated investigationType property.", "datacite": "DataCite:Subject\nInvestigation type term from a standard vocabulary. [§5.1, pp.10–11]"}, {"number": "2.1", "field": "investigationClassification", "obligation": "Mandatory", "description": " Mandatory if investigationType is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for investigationType b. The URI of the standard vocabulary being used c. The URI of the exact term used in investigationType d. The classification code (if one exists) of the exact term used in investigationType Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 2, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Generic vocabulary structure, not tied to investigation type.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nInvestigation-type vocabulary and term identifiers. [§5.1, pp.10–11]"}, {"number": "3", "field": "investigationDates", "obligation": "Mandatory", "description": " Full date range using RKMS-ISO8601 format, indicating when the archaeological project was carried out or the processing dates, as appropriate. For ongoing or multi-annual investigations specify the dates of the specific project for which the investigation took place.", "group": 3, "status": "Missing", "target": "—", "assessment": "No investigation date range, start date, or end date.", "datacite": "DataCite:Date[dateType='Other', dateInformation='Investigation Dates']\nUse Other, not Coverage; Coverage is reserved here for absolute sample dating. [§4.2, p.9]"}, {"number": "3.1", "field": "startDate", "obligation": "Mandatory", "description": " Starting date of the investigation using W3CDTF format, as specified in investigationDates.", "group": 3, "status": "Missing", "target": "—", "assessment": "No investigation date range, start date, or end date.", "datacite": "DataCite:Date[dateType='Other', dateInformation='Investigation start']\nUse Other, not Coverage; Coverage is reserved here for absolute sample dating. [§4.2, p.9]"}, {"number": "3.2", "field": "endDate", "obligation": "Mandatory", "description": " End date of the investigation using W3CDTF format, as specified in investigationDates.", "group": 3, "status": "Missing", "target": "—", "assessment": "No investigation date range, start date, or end date.", "datacite": "DataCite:Date[dateType='Other', dateInformation='Investigation end']\nUse Other, not Coverage; Coverage is reserved here for absolute sample dating. [§4.2, p.9]"}, {"number": "4", "field": "collectorExcavator", "obligation": "Mandatory", "description": " Details of the creator(s), compiler(s), funding agencies, or other bodies or people intellectually responsible for the sample collection. Used to properly credit individuals and institutions for their contribution to the resource.", "group": 4, "status": "Partial", "target": "creators", "assessment": "Creators combines created, collected, or processed roles; collector/excavator is not explicit.", "datacite": "DataCite:Creator\nCollector/excavator and Creator are treated as equivalent. [§2.2, p.4; §4.3, p.10]"}, {"number": "4.1", "field": "Name", "obligation": "Mandatory", "description": " The full name of the collectorExcavator. The format for a person's name is: Surname, Forename.", "group": 4, "status": "Partial", "target": "creators", "assessment": "Actor references/names exist without an embedded structured name.", "datacite": "DataCite:Creator.creatorName\nName within the equivalent actor structure. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.1]"}, {"number": "4.1.1", "field": "nameType", "obligation": "Optional", "description": " The type of Name. Limited to a binary choice of whether Name belongs to a person or an institution.", "group": 4, "status": "Missing", "target": "—", "assessment": "No embedded name type, name components, ORCID, affiliation, or ROR; these may exist in actor records.", "datacite": "DataCite:Creator.creatorName.nameType\nSubproperty expansion: map person/institution to Personal/Organizational. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.1.a]"}, {"number": "4.2", "field": "Forename", "obligation": "Recommended", "description": " The first or given name of the creatorExcavator. Used if creatorExcavator is a person.", "group": 4, "status": "Missing", "target": "—", "assessment": "No embedded name type, name components, ORCID, affiliation, or ROR; these may exist in actor records.", "datacite": "DataCite:Creator.givenName\nSubproperty expansion: Personal given name. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.2]"}, {"number": "4.3", "field": "Surname", "obligation": "Recommended", "description": " The last or family name of the creatorExcavator. Used if creatorExcavator is a person.", "group": 4, "status": "Missing", "target": "—", "assessment": "No embedded name type, name components, ORCID, affiliation, or ROR; these may exist in actor records.", "datacite": "DataCite:Creator.familyName\nSubproperty expansion: Personal family name. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.3]"}, {"number": "4.4", "field": "ORCID", "obligation": "Recommended", "description": " If it exists, the ORCID iD that uniquely identifies the creatorExcavator. Used if creatorExcavator is a person.", "group": 4, "status": "Missing", "target": "—", "assessment": "No embedded name type, name components, ORCID, affiliation, or ROR; these may exist in actor records.", "datacite": "DataCite:Creator.nameIdentifier[nameIdentifierScheme='ORCID']\nSubproperty expansion: ORCID iD as a name identifier. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.4]"}, {"number": "4.5", "field": "Affiliation", "obligation": "Recommended", "description": " The organizational or institutional affiliation of the creatorExcavator. Used if creatorExcavator is a person or an institution (e.g., a research department). For the latter, this would likely be the name of its larger/umbrella organization.", "group": 4, "status": "Missing", "target": "—", "assessment": "No embedded name type, name components, ORCID, affiliation, or ROR; these may exist in actor records.", "datacite": "DataCite:Creator.affiliation\nSubproperty expansion: Organizational affiliation. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.5]"}, {"number": "4.6", "field": "ROR", "obligation": "Recommended", "description": " If it exists, the ROR ID that uniquely identifies the organizational affiliation of the creatorExcavator.", "group": 4, "status": "Missing", "target": "—", "assessment": "No embedded name type, name components, ORCID, affiliation, or ROR; these may exist in actor records.", "datacite": "DataCite:Creator.affiliation.affiliationIdentifier[affiliationIdentifierScheme='ROR']\nSubproperty expansion: ROR ID of the affiliation, not of the individual. [§2.2, p.4; §4.3, p.10; DataCite 4.6 §2.5.a]"}, {"number": "5", "field": "Publisher", "obligation": "Mandatory", "description": " The organization that is registering the metadata record for the sample.", "group": 5, "status": "Direct", "target": "publisher", "assessment": "Same record-publisher scope.", "datacite": "DataCite:Publisher\nOrganization registering the sample metadata. [§2.4, p.4; §4.4, p.10]"}, {"number": "5.1", "field": "ROR", "obligation": "Recommended", "description": " If it exists, the ROR ID that uniquely identifies the publishing organization.", "group": 5, "status": "Missing", "target": "—", "assessment": "No embedded publisher ROR; it may exist in the Organisation record.", "datacite": "DataCite:Publisher.publisherIdentifier[publisherIdentifierScheme='ROR']\nSchema-level expansion of Publisher equivalence; the PDF does not separately spell out this subproperty. [§4.4, p.10; DataCite 4.6 §4.a–c]"}, {"number": "6", "field": "Contributor", "obligation": "Recommended", "description": " Other individual(s) or organization(s) who have contributed to the collecting, analysis, or managing of the sample.", "group": 6, "status": "Partial", "target": "creators; custodian", "assessment": "Selected actor roles, not a generic contributor list.", "datacite": "DataCite:Contributor\nContributor properties are treated as equivalent. [§3.2, p.6; §5.2, p.11]"}, {"number": "6.1", "field": "Role", "obligation": "Mandatory", "description": " The role that the Contributor played in the sample collection, analysis, or management process. Mandatory if a Contributor is listed.", "group": 6, "status": "Partial", "target": "creators; custodian", "assessment": "Role is implicit in property choice rather than recorded per contributor.", "datacite": "DataCite:Contributor.contributorType\nUse an allowed contributorType value; Excavator and Heritage Authority are proposals, not existing 4.6 values. [§3.2, p.6]"}, {"number": "6.2", "field": "Name", "obligation": "Mandatory", "description": " The full name of the Contributor. The format for a person's name is: Surname, Forename.", "group": 6, "status": "Partial", "target": "creators; custodian", "assessment": "Name/reference exists for selected actor roles.", "datacite": "DataCite:Contributor.contributorName\nName within the equivalent actor structure. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.1]"}, {"number": "6.2.1", "field": "nameType", "obligation": "Recommended", "description": " The type of Name. Limited to a binary choice of whether Name belongs to a person or an institution.", "group": 6, "status": "Missing", "target": "—", "assessment": "No embedded contributor name structure, ORCID, affiliation, or ROR.", "datacite": "DataCite:Contributor.contributorName.nameType\nSubproperty expansion: map person/institution to Personal/Organizational. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.1.a]"}, {"number": "6.3", "field": "Forename", "obligation": "Recommended", "description": " The first or given name of the Contributor. Used if Contributor is a person.", "group": 6, "status": "Missing", "target": "—", "assessment": "No embedded contributor name structure, ORCID, affiliation, or ROR.", "datacite": "DataCite:Contributor.givenName\nSubproperty expansion: Personal given name. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.2]"}, {"number": "6.4", "field": "Surname", "obligation": "Recommended", "description": " The last or family name of the Contributor. Used if Contributor is a person.", "group": 6, "status": "Missing", "target": "—", "assessment": "No embedded contributor name structure, ORCID, affiliation, or ROR.", "datacite": "DataCite:Contributor.familyName\nSubproperty expansion: Personal family name. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.3]"}, {"number": "6.5", "field": "ORCID", "obligation": "Recommended", "description": " If it exists, the ORCID iD that uniquely identifies the Contributor. Used if Contributor is a person.", "group": 6, "status": "Missing", "target": "—", "assessment": "No embedded contributor name structure, ORCID, affiliation, or ROR.", "datacite": "DataCite:Contributor.nameIdentifier[nameIdentifierScheme='ORCID']\nSubproperty expansion: ORCID iD as a name identifier. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.4]"}, {"number": "6.6", "field": "Affiliation", "obligation": "Recommended", "description": " The organizational or institutional affiliation of the Contributor. Used if Contributor is a person or an institution (e.g., a research department). For the latter, this would likely be the name of its larger/umbrella organization.", "group": 6, "status": "Missing", "target": "—", "assessment": "No embedded contributor name structure, ORCID, affiliation, or ROR.", "datacite": "DataCite:Contributor.affiliation\nSubproperty expansion: Organizational affiliation. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.5]"}, {"number": "6.7", "field": "ROR", "obligation": "Recommended", "description": " If it exists, the ROR ID that uniquely identifies the organizational affiliation of the Contributor.", "group": 6, "status": "Missing", "target": "—", "assessment": "No embedded contributor name structure, ORCID, affiliation, or ROR.", "datacite": "DataCite:Contributor.affiliation.affiliationIdentifier[affiliationIdentifierScheme='ROR']\nSubproperty expansion: ROR ID of the affiliation, not of the individual. [§3.2, p.6; §5.2, p.11; DataCite 4.6 §7.5.a]"}, {"number": "7", "field": "sampleTitle", "obligation": "Mandatory", "description": "Title or name that enables discovery and distinction of the sample. Information may include the basic form of the object, the material(s) that compose to the sample, and any local sample identifiers.", "group": 7, "status": "Direct", "target": "custodianLabel; titles[].title", "assessment": "Primary and alternative labels cover discovery; neither HSR field is required.", "datacite": "DataCite:Title\nClosest match; §4.5 cautions that some title information may be held elsewhere. [§2.3, p.4; §4.5, p.10]"}, {"number": "8", "field": "Description", "obligation": "Recommended", "description": "Detailed description of the sample. Should include information about the sample and its collection not captured in other properties. For example, the primary reason for sample collection in terms of analytics.", "group": 8, "status": "Direct", "target": "otherDescriptions[].description", "assessment": "Use the HSR vocabulary value for Sample description.", "datacite": "DataCite:Description[descriptionType='Abstract']\nSample description. [§3.5, p.8; §5.3, p.11]"}, {"number": "9", "field": "Subject", "obligation": "Recommended", "description": "Keywords for the subject content of the sample. Keywords should be taken from standard vocabulary, such as the English Heritage NMR Monument Types Thesaurus, MDA Archaeological Object Thesaurus, or the Getty Research Institute Art & Architecture Thesaurus.", "group": 9, "status": "Direct", "target": "subjects[].subject", "assessment": "Same subject/keyword/classification term scope.", "datacite": "DataCite:Subject\nSample subject term. [§5.4, p.11]"}, {"number": "9.1", "field": "subjectClassification", "obligation": "Mandatory", "description": "Mandatory if Subject is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for Subject b. The URI of the standard vocabulary being used c. The URI of the exact term used in Subject d. The classification code (if one exists) of the exact term used in Subject Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 9, "status": "Direct", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "HSR supports scheme and concept identifiers.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nDistribute subject classification information across the relevant subproperties. [§5.4, p.11]"}, {"number": "10", "field": "otherIdentifier", "obligation": "Mandatory", "description": "The project / reference / catalogue / sample number(s) used to identify the sample on site.", "group": 10, "status": "Direct", "target": "custodianLabel; titles[].title; alternateIdentifiers[].alternateIdentifier", "assessment": "Supports local labels and alternate identifiers; principalIdentifier only suits a principal URI.", "datacite": "DataCite:alternateIdentifier\nLocal project/reference/catalogue/sample identifiers; not the automatically assigned DOI. [§4.6, p.10; §2.1, p.4]"}, {"number": "11", "field": "collectionDate", "obligation": "Mandatory", "description": "Date when sample was collected following W3CDTF format. Multiple samples from the same source should be registered separately and then connected through the Relations property metadata. May optionally include the time at which the sample was collected.", "group": 11, "status": "Direct", "target": "dates.collectedDate", "assessment": "Same meaning, but optional in HSR.", "datacite": "DataCite:Date[dateType='Collected']\nSample collection date. [§4.7, p.10]"}, {"number": "12", "field": "collectionMethod", "obligation": "Recommended", "description": "How the sample was collected. Where possible, terminology should follow a standard vocabulary.", "group": 12, "status": "Direct", "target": "otherDescriptions[].description", "assessment": "Use Sampling method description type; classification is not preserved.", "datacite": "DataCite:Description[descriptionType='Methods']; DataCite:Subject\nInclude the collection method in Methods; optionally repeat vocabulary-based terms in Subject. [§5.5, p.11]"}, {"number": "12.1", "field": "collectionMethodClassification", "obligation": "Mandatory", "description": "Mandatory if collectionMethod is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for collectionMethod b. The URI of the standard vocabulary being used c. The URI of the exact term used in collectionMethod d. The classification code (if one exists) of the exact term used in collectionMethod Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 12, "status": "Missing", "target": "—", "assessment": "No sampling-method vocabulary metadata.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nExpansion of optional Subject repetition for vocabulary-based collection methods; not separately itemized in §5.5. [§5.5, p.11; DataCite 4.6 §6]"}, {"number": "12.2", "field": "sampleHousing", "obligation": "Mandatory", "description": "What the sample was collected in. If the housing changes at the other stages of the lifecycle, then sampleHousing may be updated to include the new housing and the lifecycle stage (e.g., during analysis or storage). Mandatory if collectionMethod is included.", "group": 12, "status": "Missing", "target": "—", "assessment": "No sample housing/container field.", "datacite": "DataCite:Description[descriptionType='Methods']\nCombine sample housing with the collection method. [§5.5, p.11]"}, {"number": "12.3", "field": "samplePhoto", "obligation": "Recommended", "description": "A link to a photograph of the sample or its bag/container at the time of collection. Recommendations for photographing archaeological artefacts are given in this guidance document.", "group": 12, "status": "Partial", "target": "sampleSource.sampleSiteAnnotationUrl; relatedIdentifiers[].relatedIdentifier", "assessment": "Can link documentation, but no dedicated collection-time sample photograph.", "datacite": "DataCite:relatedIdentifier[relatedIdentifierType='URL', relationType='IsDocumentedBy', resourceTypeGeneral='Image']\nLink to the sample/container photograph. [§5.5, p.11]"}, {"number": "12.3.1", "field": "photoLicence", "obligation": "Mandatory", "description": "Any licence information concerning reuse of the sample photograph. Mandatory if samplePhoto is included.", "group": 12, "status": "Partial", "target": "rightsList", "assessment": "General rights cannot be bound specifically to the photograph.", "datacite": "DataCite:Rights\nPhotograph reuse licence. The recommendation flags that this stretches Rights, normally used for the registered sample. [§5.5, p.11]"}, {"number": "13", "field": "stratigraphicContext", "obligation": "Recommended", "description": "The site or project specific identifier of the stratigraphic or survey unit from which the sample was collected. This property is considered mandatory in the case of samples collected during surveys and excavations.", "group": 13, "status": "Partial", "target": "sampleSource.sourceId; sampleSource.sampleSiteDescription", "assessment": "Source/sampling site lacks archaeological stratigraphic-unit semantics.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate stratigraphic context and its subproperties into the description; no dedicated structured target. [§5.6, pp.11–12]"}, {"number": "13.1", "field": "contextType", "obligation": "Recommended", "description": "The type of stratigraphicContext. Should follow a vocabulary reference such as the Getty Research Institute Art & Architecture Thesaurus.", "group": 13, "status": "Partial", "target": "sampleType; subjects[].subject", "assessment": "Generic type/subject without contextType semantics.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate stratigraphic context and its subproperties into the description; no dedicated structured target. [§5.6, pp.11–12]"}, {"number": "13.1.1", "field": "contextClassification", "obligation": "Mandatory", "description": "Mandatory if contextType is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for contextType b. The URI of the standard vocabulary being used c. The URI of the exact term used in contextType d. The classification code (if one exists) of the exact term used in contextType Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 13, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Generic vocabulary structure only.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate stratigraphic context and its subproperties into the description; no dedicated structured target. [§5.6, pp.11–12]"}, {"number": "13.2", "field": "siteDiagram", "obligation": "Recommended", "description": "Image of site that makes the exact location of the sample clear.", "group": 13, "status": "Partial", "target": "sampleSource.sampleSiteAnnotationUrl", "assessment": "A linked image/IIIF annotation can show sampling position.", "datacite": "DataCite:relatedIdentifier[relatedIdentifierType='URL', relationType='IsDocumentedBy', resourceTypeGeneral='Image']\nLink to the site diagram. [§5.6, p.12]"}, {"number": "13.2.1", "field": "siteDiagramLicence", "obligation": "Mandatory", "description": "Any licence information concerning reuse of the site diagram. Mandatory if siteDiagram is included.", "group": 13, "status": "Partial", "target": "rightsList", "assessment": "General rights cannot be bound specifically to the diagram.", "datacite": "DataCite:Rights\nSite diagram reuse licence; the same image-rights caveat as for samplePhoto applies. [§5.6, p.12; §5.5, p.11]"}, {"number": "13.3", "field": "Zone", "obligation": "Recommended", "description": "Identifier(s) of the zone(s) from which the sample was collected. Such that relevant, investigation-specific information may be captured, ‘zone’ is deliberately left undefined. It may be an area/quadrant, trench, or otherwise. Moreover, identifiers from zones at different granularities may be included. In this latter case, it is recommended to include the type of zone alongside each identifier.", "group": 13, "status": "Missing", "target": "—", "assessment": "No archaeological zone identifier.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate stratigraphic context and its subproperties into the description; no dedicated structured target. [§5.6, pp.11–12]"}, {"number": "13.4", "field": "soilTexture", "obligation": "Recommended", "description": "Texture as per agreed standards, such as the FAO World Reference Base for Soil Resources.", "group": 13, "status": "Partial", "target": "materialTerms; subjects[].subject", "assessment": "Can be generic material/subject, not dedicated context texture.", "datacite": "DataCite:Subject\nSoil texture using agreed standards. [§5.6, p.12]"}, {"number": "13.4.1", "field": "soilClassification", "obligation": "Mandatory", "description": "Mandatory if soilTexture is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for soilTexture b. The URI of the standard vocabulary being used c. The URI of the exact term used in soilTexture d. The classification code (if one exists) of the exact term used in soilTexture Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 13, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Generic vocabulary structure only.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nSoil-texture vocabulary and term identifiers. [§5.6, p.12]"}, {"number": "13.5", "field": "contextDescription", "obligation": "Optional", "description": "Additional information about the stratigraphicContext.", "group": 13, "status": "Partial", "target": "sampleSource.sampleSiteDescription; otherDescriptions[].description", "assessment": "Free text can carry details, but stratigraphic scope is implicit.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate stratigraphic context and its subproperties into the description; no dedicated structured target. [§5.6, pp.11–12]"}, {"number": "14", "field": "sampleDepth", "obligation": "Recommended", "description": "Depth of the sample within the stratigraphicContext.", "group": 14, "status": "Direct", "target": "sizes", "assessment": "Allows depth with units as an unstructured string.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate depth, depthUnits and depthReferencePoint in the description. [§5.7, p.12]"}, {"number": "14.1", "field": "depthUnits", "obligation": "Mandatory", "description": "Units used to measure depth of sample. Mandatory if sample depth is included.", "group": 14, "status": "Partial", "target": "sizes", "assessment": "Unit is embedded rather than separately typed/validated.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate depth, depthUnits and depthReferencePoint in the description. [§5.7, p.12]"}, {"number": "14.2", "field": "depthReferencePoint", "obligation": "Recommended", "description": "The reference point in the context from where the sample depth was measured.", "group": 14, "status": "Missing", "target": "—", "assessment": "No depth reference-point field.", "datacite": "DataCite:Description[descriptionType='Abstract']\nConcatenate depth, depthUnits and depthReferencePoint in the description. [§5.7, p.12]"}, {"number": "15", "field": "sampleWeight", "obligation": "Recommended", "description": "Weight at the point of collection, before analysis.", "group": 15, "status": "Direct", "target": "sizes", "assessment": "Allows weight with units as an unstructured string.", "datacite": "DataCite:Size\nConcatenate sample weight, units and measurement conditions; a free-text Size value, not separate numeric fields. [§5.8, p.12]"}, {"number": "15.1", "field": "weightUnits", "obligation": "Mandatory", "description": "Units used to measure sample weight. Mandatory if sample weight is included.", "group": 15, "status": "Partial", "target": "sizes", "assessment": "Unit is embedded rather than separately typed/validated.", "datacite": "DataCite:Size\nConcatenate sample weight, units and measurement conditions; a free-text Size value, not separate numeric fields. [§5.8, p.12]"}, {"number": "15.2", "field": "weightConditions", "obligation": "Recommended", "description": "Additional information about the state of the sample at the time the weight was measured.", "group": 15, "status": "Missing", "target": "—", "assessment": "No measurement-condition field.", "datacite": "DataCite:Size\nConcatenate sample weight, units and measurement conditions; a free-text Size value, not separate numeric fields. [§5.8, p.12]"}, {"number": "16", "field": "sampleMaterialType", "obligation": "Mandatory", "description": "The type(s) of material(s) that compose the sample. Should follow a controlled vocabulary such as the Getty Research Institute Art & Architecture Thesaurus.", "group": 16, "status": "Direct", "target": "materialTerms", "assessment": "Same sample/source material-term scope.", "datacite": "DataCite:Subject\nMaterials composing the sample. [§3.1, pp.5–6; §4.8, p.10]"}, {"number": "16.1", "field": "materialClassification", "obligation": "Mandatory", "description": "The vocabulary used for classification of the material type. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for sampleMaterialType b. The URI of the standard vocabulary being used c. The URI of the exact term used in sampleMaterialType d. The classification code (if one exists) of the exact term used in sampleMaterialType Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 16, "status": "Partial", "target": "materialTerms", "assessment": "Vocabulary details are delegated to VocabularyConcept records.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nMaterial vocabulary and term identifiers. [§4.8, p.10]"}, {"number": "17", "field": "Colour", "obligation": "Recommended", "description": "Colour(s) of the sample following a standard vocabulary such as the Munsell colour system.", "group": 17, "status": "Partial", "target": "subjects[].subject; otherDescriptions[].description", "assessment": "Colour can be generic content, but has no dedicated property.", "datacite": "DataCite:Description[descriptionType='Abstract']; DataCite:Subject\nCombine colour information in Abstract; optionally repeat vocabulary-based colour terms in Subject. [§5.9, p.12]"}, {"number": "17.1", "field": "colourClassification", "obligation": "Mandatory", "description": "The vocabulary used for classification of the sample colour(s). Mandatory if Colour is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for Colour b. The URI of the standard vocabulary being used c. The URI of the exact term used in Colour d. The classification code (if one exists) of the exact term used in Colour Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 17, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Vocabulary mechanics only through generic subjects.", "datacite": "DataCite:Description[descriptionType='Abstract']; DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nInclude classification in the colour description; optionally repeat it in Subject subproperties. [§5.9, p.12]"}, {"number": "17.2", "field": "colouredArea", "obligation": "Recommended", "description": "The area of the sample for which colours are being described.", "group": 17, "status": "Missing", "target": "—", "assessment": "No coloured-area qualifier.", "datacite": "DataCite:Description[descriptionType='Abstract']\nCombine the coloured area with the other colour information. [§5.9, p.12]"}, {"number": "18", "field": "absoluteDating", "obligation": "Recommended", "description": "Numerical age or range of the sample. Dates and ranges should follow W3CDTF and RKMS-ISO8601, respectively.", "group": 18, "status": "Partial", "target": "subjects[].subject; otherDescriptions[].description", "assessment": "No numerical age/range property; generic encoding loses date semantics.", "datacite": "DataCite:Date[dateType='Coverage']\nNumerical sample age or range; not the investigation dates. [§5.10, p.13]"}, {"number": "18.1", "field": "datingMethod", "obligation": "Recommended", "description": "Should follow a standard vocabulary such as that provided by the Dating Techniques concept provided in the FISH Archaeological Sciences Thesaurus.", "group": 18, "status": "Partial", "target": "subjects[].subject; otherDescriptions[].description", "assessment": "No dedicated dating method.", "datacite": "DataCite:Date[dateType='Coverage'].dateInformation; DataCite:Subject\nDating method in dateInformation; optional repetition in Subject. [§5.10, p.13]"}, {"number": "18.2", "field": "datingClassification", "obligation": "Mandatory", "description": "The vocabulary used for the absolute dating method. Mandatory if datingMethod is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for datingMethod b. The URI of the standard vocabulary being used c. The URI of the exact term used in datingMethod d. The classification code (if one exists) of the exact term used in datingMethod Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 18, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Generic vocabulary mechanics only.", "datacite": "DataCite:Date[dateType='Coverage'].dateInformation; DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nDating classification in dateInformation; optional repetition using Subject classification subproperties. [§5.10, p.13; DataCite 4.6 §6]"}, {"number": "19", "field": "relativeDating", "obligation": "Recommended", "description": "Cultural and user created values for relative dating of the sample. Should follow a standard vocabulary such as the Getty Research Institute Art & Architecture Thesaurus.", "group": 19, "status": "Partial", "target": "subjects[].subject", "assessment": "Controlled subject can encode period but not dating role.", "datacite": "DataCite:Subject\nRelative/cultural dating term. [§5.11, p.13]"}, {"number": "19.1", "field": "datingClassification", "obligation": "Mandatory", "description": "The vocabulary used for the relative dating method. Mandatory if relativeDating is included. Should contain at least one, and ideally all, of the following: a. The name of the standard vocabulary being used for relativeDating b. The URI of the standard vocabulary being used c. The URI of the exact term used in relativeDating d. The classification code (if one exists) of the exact term used in relativeDating Note that a&b and c&d are normally pair values, so it is encouraged to include both where possible. For machine readability, and if you are using a FAIR vocabulary, it is recommended to include the URI values, with c, being optimal.", "group": 19, "status": "Partial", "target": "subjects[].subjectScheme; subjects[].schemeUri; subjects[].valueUri; subjects[].classificationCode", "assessment": "Generic vocabulary mechanics only.", "datacite": "DataCite:Subject.subjectScheme; DataCite:Subject.schemeURI; DataCite:Subject.valueURI; DataCite:Subject.classificationCode\nRelative-dating vocabulary and term identifiers. [§5.11, p.13]"}, {"number": "20", "field": "generalKeywords", "obligation": "Optional", "description": "User created values to describe aspects of the sample not covered by other metadata.", "group": 20, "status": "Direct", "target": "subjects[].subject", "assessment": "Supports free-text keywords; HSR excludes material terms/sample type from subjects.", "datacite": "Not explicitly mapped\nNo separate mapping for generalKeywords is specified in the supplied recommendation. [§§3–5]"}, {"number": "21", "field": "currentStatus", "obligation": "Recommended", "description": "Information concerning the current status of the sample. Does the sample still exist? Was it discarded/destroyed in analysis or otherwise? Has it degraded over time or been lost? Note that it is recommended to also indicate the date that the value of the status was revised.", "group": 21, "status": "Partial", "target": "dates.consumedDate; dates.destroyedDate; custodian; geoLocations", "assessment": "Selected lifecycle dates/custody/location, but no complete status statement.", "datacite": "DataCite:Description[descriptionType='TechnicalInfo']; DataCite:Date[dateType='Other']\nDescribe current status in TechnicalInfo; for events such as destruction/discarding, also record an Other date with explanatory dateInformation. [§5.12, p.13]"}, {"number": "21.1", "field": "storageLocation", "obligation": "Recommended", "description": "Current physical storage location of sample.", "group": 21, "status": "Partial", "target": "custodian; geoLocations", "assessment": "No storage-location string or shelf/container locator.", "datacite": "DataCite:Description[descriptionType='TechnicalInfo']\nInclude storage location with the current-status description. [§5.12, p.13]"}, {"number": "21.2", "field": "accessConditions", "obligation": "Recommended", "description": "What the access rights are to the sample and/or who to contact about access. Access rights should ideally follow a controlled vocabulary.", "group": 21, "status": "Partial", "target": "rightsList", "assessment": "Resource rights are not physical-sample access/contact conditions.", "datacite": "DataCite:Rights\nAccess conditions; use Rights subproperties as appropriate for the controlled vocabulary. [§5.12, p.13]"}, {"number": "21.2.1", "field": "accessType", "obligation": "Optional", "description": "Whether the sample is publicly available or only for private use. A binary choice to enable a quick understanding of access rights.", "group": 21, "status": "Missing", "target": "—", "assessment": "No Public/Private physical-access flag.", "datacite": "DataCite:Rights\nExpansion of the access-conditions mapping: retain public/private access information within Rights; no dedicated accessType field. [§5.12, p.13]"}, {"number": "22", "field": "Relations", "obligation": "Recommended", "description": "Relationships to other research outputs/entities that are identified by a globally unique identifier. In particular, if the sample was derived or subsampled from a parent source, and any references to analytical results (datasets).", "group": 22, "status": "Direct", "target": "relatedIdentifiers; sampleSource.sourceId", "assessment": "PID relations and source derivation are explicit.", "datacite": "DataCite:relatedIdentifier\nAlmost 1:1 mapping; the recommendation encourages a HasMetadata link to ArchProfile metadata. [§3.4, p.7; §5.13, p.13]"}, {"number": "22.1", "field": "relatedIdentifier", "obligation": "Mandatory", "description": "The globally unique identifier assigned to the related research output/entity. Mandatory if Relations is used.", "group": 22, "status": "Direct", "target": "relatedIdentifiers[].relatedIdentifier", "assessment": "Same globally unique identifier scope.", "datacite": "DataCite:relatedIdentifier\nIdentifier of the related resource. [§3.4, p.7; §5.13, p.13]"}, {"number": "22.2", "field": "identifierType", "obligation": "Mandatory", "description": "The type of globally unique identifier that is assigned to the related research output/entity. Mandatory if Relations is used.", "group": 22, "status": "Direct", "target": "relatedIdentifiers[].relatedIdentifierType", "assessment": "Same identifier-type scope.", "datacite": "DataCite:relatedIdentifier.relatedIdentifierType\nIdentifier scheme/type. [§3.4, p.7; §5.13, p.13]"}, {"number": "22.3", "field": "relationType", "obligation": "Mandatory", "description": "The relationship between the current sample being described and the related research output/entity. Mandatory if Relations is used.", "group": 22, "status": "Direct", "target": "relatedIdentifiers[].relationType", "assessment": "Same relationship-type scope.", "datacite": "DataCite:relatedIdentifier.relationType\nUse the applicable DataCite controlled relation type. [§3.4, p.7; §5.13, p.13]"}, {"number": "22.4", "field": "relatedMetadataScheme", "obligation": "Mandatory", "description": "Mandatory only if either the HasMetadata or IsMetadataFor relationType is used, should not be used in other cases. If the sample has already been described using a metadata schema specific to your institution, discipline, or community, this may be linked using the ‘HasMetadata’ relationType attribute. Typically, this will take the form of a web-hosted metadata file (via an API endpoint), in which case the 'URL' identifierType should be used. The name, URI, and type of the related schema should be included.", "group": 22, "status": "Direct", "target": "relatedIdentifiers[].relatedMetadataScheme; relatedIdentifiers[].schemeUri; relatedIdentifiers[].schemeType", "assessment": "Separates scheme name, URI, and type.", "datacite": "DataCite:relatedIdentifier.relatedMetadataScheme; DataCite:relatedIdentifier.schemeURI\nFor HasMetadata/IsMetadataFor, separate schema name and schema URI from the combined ArchProfile value. [§3.4, p.7]"}, {"number": "22.5", "field": "relatedResource", "obligation": "Recommended", "description": "The type of the related research output/entity. Should follow a controlled vocabulary; for example, that used for the resourceTypeGeneral property in the DataCite Metadata Schema.", "group": 22, "status": "Direct", "target": "relatedIdentifiers[].resourceTypeGeneral", "assessment": "Same related-resource type scope.", "datacite": "DataCite:relatedIdentifier.resourceTypeGeneral\nUse the nearest controlled type, or Other if none matches. The PDF also asks to retain the original type; DataCite 4.6 relatedIdentifier has no free-text resourceType subproperty. [§3.4, p.7; DataCite 4.6 §12]"}]</script><script>
const rows=JSON.parse(document.getElementById('data').textContent),$=s=>document.querySelector(s);let state={q:'',status:'All',group:'all'},compact=true;const names={1:'Project',2:'Investigation type',3:'Investigation dates',4:'Collector / excavator',5:'Publisher',6:'Contributor',7:'Sample title',8:'Description',9:'Subject',10:'Other identifier',11:'Collection date',12:'Collection method',13:'Stratigraphic context',14:'Sample depth',15:'Sample weight',16:'Material type',17:'Colour',18:'Absolute dating',19:'Relative dating',20:'Keywords',21:'Current status',22:'Relations'};Object.entries(names).forEach(([n,v])=>$('#group').insertAdjacentHTML('beforeend',`<option value="${n}">${n}. ${v}</option>`));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),paths=s=>s==='—'?'—':s.split(';').map(x=>`<code>${esc(x.trim())}</code>`).join(' ');const dataciteCell=s=>{const [target,...note]=s.split('\n');return paths(target)+(note.length?`<div class="muted datacite-note">${esc(note.join(' '))}</div>`:'')};function get(){let q=state.q.toLowerCase();return rows.filter(r=>(state.status==='All'||r.status===state.status)&&(state.group==='all'||String(r.group)===state.group)&&(!q||Object.values(r).join(' ').toLowerCase().includes(q)))}function render(){let d=get();$('#body').innerHTML=d.map(r=>`<tr><td><span class="fid">${esc(r.number)}</span><span class="fname">${esc(r.field)}</span></td><td class="muted">${esc(r.obligation)}</td><td class="muted">${esc(r.description)}</td><td><span class="badge ${r.status}">${r.status}</span></td><td>${paths(r.target)}</td><td class="muted">${esc(r.assessment)}</td><td>${dataciteCell(r.datacite)}</td></tr>`).join('');$('#mobile').innerHTML=d.map(r=>`<details class="card"><summary><span><span class="fid">${esc(r.number)}</span><b>${esc(r.field)}</b></span><span class="badge ${r.status}">${r.status}</span></summary><div class="cardbody"><div><span class="label">Obligation</span>${esc(r.obligation)}</div><div><span class="label">Definition</span>${esc(r.description)}</div><div><span class="label">HSR target</span>${paths(r.target)}</div><div><span class="label">Assessment</span>${esc(r.assessment)}</div><div><span class="label">DataCite mapping</span>${dataciteCell(r.datacite)}</div></div></details>`).join('');$('#result').textContent=`Showing ${d.length} of ${rows.length} fields`;$('#empty').style.display=d.length?'none':'block'}$('#search').oninput=e=>{state.q=e.target.value;render()};$('#group').onchange=e=>{state.group=e.target.value;render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{state.status=b.dataset.status;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});$('#export').onclick=()=>{let fs=['number','field','obligation','description','status','target','assessment','datacite'],q=v=>'"'+String(v).replaceAll('"','""')+'"',csv=[fs.join(','),...get().map(r=>fs.map(k=>q(r[k])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='archaeology-hsr-v09-filtered.csv';a.click()};let theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=theme;$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme};$('#density').onclick=()=>{compact=!compact;document.body.style.fontSize=compact?'14px':'15px';document.querySelector('table').style.fontSize=compact?'12px':'13px';document.querySelectorAll('td').forEach(x=>x.style.padding=compact?'6px 8px':'9px 10px');$('#density').setAttribute('aria-label',compact?'Switch to comfortable density':'Switch to compact density')};render();
</script></body></html>
